[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3"
async-nats = "0.49.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
rust_decimal = "1"
serde_json = "1.0.151"
prost = "0.14.4"
prost-derive = "0.14.4"

[[bin]]
name = "engine"
path = "src/main.rs"
